services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    ports:
      - "127.0.0.1:8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"
    networks:
      - formularios-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: dynamodb-admin
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=sa-east-1
    depends_on:
      dynamodb-local:
        condition: service_healthy
    networks:
      - formularios-network

  floci:
    # Emulador de S3 (fotos por URL assinada) no lugar do LocalStack, que passou a exigir conta.
    # Tag fixa, nunca `latest`. O DynamoDB continua no DynamoDB Local (código da própria AWS).
    # Só no loopback: o emulador aceita qualquer credencial.
    image: floci/floci:2.4.0
    container_name: floci
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - FLOCI_DEFAULT_REGION=sa-east-1
    networks:
      - formularios-network

networks:
  formularios-network:
    name: formularios-network
    driver: bridge