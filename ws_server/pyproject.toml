[project]
name = "informs-ws-server"
version = "0.1.0"
description = "WebSocket server pra tracking realtime de motoverificadores (Informs)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.137.2",
    "uvicorn[standard]==0.30.6",
    "websockets==13.0.1",
    "boto3==1.35.0",
    "pydantic==2.9.0",
    # python-jose: validação de JWT do Cognito (RS256 com JWKS).
    "python-jose[cryptography]==3.5.0",
    "httpx==0.27.0",  # busca JWKS sem precisar de dep async extra
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "moto[dynamodb]==5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
