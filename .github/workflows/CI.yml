name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testApp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.10
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install --only-binary :all: -r requirements.txt
      - name: Generate OpenAPI from Pydantic Contracts
        run: |
          pip install --only-binary :all: pydantic==2.9.2
          PYTHONPATH=. python -m src.shared.helpers.functions.generate_openapi_from_contracts
          git diff --exit-code src/modules/docs/app/swagger.json
          git diff --exit-code src/modules/docs/app/swagger.contracts.json
      - name: Runs tests
        run: pytest
        env:
          STAGE: TEST
      - name: Create coverage report
        run: |
          pytest --cov=./src/
        env:
          STAGE: TEST

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  testWsServer:
    # Testa o subprojeto ws_server (FastAPI + websockets) isoladamente.
    # Roda em paralelo ao testApp com deps próprias (fastapi, httpx, moto)
    # declaradas em ws_server/pyproject.toml + uv.lock. O testApp ignora
    # tests/ws_server via pytest.ini (norecursedirs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install --only-binary :all: uv==0.12.7
      - name: Install ws_server deps from lock
        run: |
          cd ws_server
          uv sync --frozen --extra dev --no-build
      - name: Run ws_server tests
        run: |
          cd ws_server
          uv run --frozen pytest ../tests/ws_server -v
