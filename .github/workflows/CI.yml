name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testApp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Merge OpenAPI YAMLs
        run: |
          pip install pyyaml==6.0.1
          python scripts/merge_openapi.py
          git diff --exit-code src/modules/docs/app/swagger.json
          git diff --exit-code src/modules/docs/app/swagger.merged.yaml
      - name: Generate OpenAPI Contracts
        run: |
          PYTHONPATH=. python -m src.shared.helpers.functions.generate_openapi_from_contracts
      - name: Check OpenAPI Contract Drift
        run: |
          PYTHONPATH=. python -m src.shared.helpers.functions.check_openapi_contract_drift
      - name: Runs tests
        run: pytest
        env:
          STAGE: TEST
      - name: Create coverage report
        run: |
          pytest --cov=./src/
        env:
          STAGE: TEST

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
