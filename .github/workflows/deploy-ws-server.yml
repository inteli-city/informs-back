name: Deploy WS Server

# Disparado em push pra dev/homolog/prod quando algo do ws_server muda.
# Cada branch deploya seu próprio processo systemd na Lightsail compartilhada
# (informs-ws-dev / -homolog / -prod). O Caddyfile e o IP estático são
# compartilhados — qualquer deploy reescreve o Caddyfile, mas como o conteúdo
# é determinístico (só depende do static IP) o reload vira no-op.
on:
  push:
    branches: [dev, homolog, prod]
    paths:
      - "ws_server/**"
      - "iac/ws_server_bootstrap/Caddyfile.template"
      - "scripts/deploy_ws_server.sh"
      - ".github/workflows/deploy-ws-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    # Mesma estratégia do CD.yml: GH Environment carrega secrets por branch
    # (AWS_*, COGNITO_USER_POOL_ID, COGNITO_APP_CLIENT_ID).
    environment:
      name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install jq + rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq rsync

      - name: Run deploy script
        env:
          STAGE: ${{ github.ref_name }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          COGNITO_USER_POOL_ID: ${{ secrets.USER_POOL_ID }}
          COGNITO_APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
        run: bash scripts/deploy_ws_server.sh
