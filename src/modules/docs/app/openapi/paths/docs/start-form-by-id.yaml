post:
  summary: Inicia o preenchimento (Preenchedor)
  tags: [Forms]
  parameters:
    - name: formId
      in: path
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: "../../components/requests/start-form-request.yaml" }
  responses:
    "204": { description: Status atualizado para IN_PROGRESS }
    "409": { description: Conflito de atualização }
