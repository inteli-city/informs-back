get:
  summary: Consulta formulário por ID
  tags: [Forms]
  parameters:
    - name: formId
      in: path
      required: true
      schema: { type: string }
  responses:
    "200":
      description: Dados do formulário
      content:
        application/json:
          schema: { $ref: "../../components/responses/get-form-response.yaml" }
    "404": { description: Não encontrado }
    "500": { description: Erro interno }
