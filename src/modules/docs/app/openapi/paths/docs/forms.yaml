post:
  summary: Criação de novo formulário
  tags: [Forms]
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: "../../components/requests/create-form-request.yaml" }
  responses:
    "201":
      description: Formulário criado
      content:
        application/json:
          schema: { $ref: "../../components/responses/create-form-response.yaml" }
    "400": { description: Dados inválidos }
    "401": { description: Unauthorized }
    "404": { description: Item não encontrado }
    "409": { description: Conflito }
    "500": { description: Erro interno }
get:
  summary: Listagem de formulários com filtros
  tags: [Forms]
  parameters:
    - name: page
      in: query
      schema: { type: integer, default: 1 }
    - name: limit
      in: query
      schema: { type: integer, default: 20 }
    - name: status
      in: query
      schema:
        type: array
        items:
          $ref: "../../components/enums/docs/form-status.yaml"
    - name: system
      in: query
      schema:
        type: array
        items:
          type: string
    - name: user_id
      in: query
      schema: { type: string }
  responses:
    "200":
      description: Lista de formulários
      content:
        application/json:
          schema: { $ref: "../../components/responses/list-forms-response.yaml" }
    "401": { description: Unauthorized }
    "500": { description: Erro interno }
