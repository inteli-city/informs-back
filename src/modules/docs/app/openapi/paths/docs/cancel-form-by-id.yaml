post:
  summary: Cancela o formulário
  tags: [Forms]
  parameters:
    - name: formId
      in: path
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: "../../components/requests/cancel-form-request.yaml" }
  responses:
    "200":
      description: Cancelado com sucesso
      content:
        application/json:
          schema: { $ref: "../../components/responses/cancel-form-response.yaml" }
