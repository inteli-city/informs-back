post:
  summary: Submete o formulário preenchido
  tags: [Forms]
  parameters:
    - name: formId
      in: path
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema: { $ref: "../../components/requests/submit-form-request.yaml" }
  responses:
    "200":
      description: Formulário concluído
      content:
        application/json:
          schema: { $ref: "../../components/responses/submit-form-response.yaml" }
    "400": { description: Validação falhou }
