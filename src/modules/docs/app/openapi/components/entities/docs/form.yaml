FormSection:
  type: object
  required: [section_id, fields]
  properties:
    section_id: { type: number }
    fields:
      type: array
      items: { $ref: "field.yaml#/Field" }


Form:
  type: object
  properties:
    id: { type: string, readOnly: true }
    form_title: { type: string }
    user_id: { type: string, description: "ID do usuário preenchedor (Gates)" }
    template: { type: string, nullable: true }
    system: { type: string }
    city: { type: string }
    area: { type: string, nullable: true }
    street: { type: string }
    number: { type: number, nullable: true }
    latitude: { type: number }
    longitude: { type: number }
    priority: { $ref: "../../enums/docs/form-priority.yaml", default: 0 }
    observation: { type: string, nullable: true }
    expiration_date: { type: number, nullable: true, description: "Timestamp em ms" }
    status: { $ref: "../../enums/docs/form-status.yaml", default: PENDING }
    in_progress_at: { type: integer, format: int64, nullable: true, description: "Timestamp em ms" }
    cancelled_at: { type: integer, format: int64, nullable: true, description: "Timestamp em ms" }
    completed_at: { type: integer, format: int64, nullable: true, description: "Timestamp em ms" }
    created_by: { type: string }
    created_at: { type: integer, format: int64, readOnly: true, description: "Timestamp em ms" }
    updated_at: { type: integer, format: int64, readOnly: true, description: "Timestamp em ms" }
    justification: { $ref: "justification.yaml#/Justification" }
    sections:
      type: array
      items: { $ref: "#/FormSection" }
    information_fields:
      type: array
      items: { $ref: "information-field.yaml#/InformationFieldInput" }
      nullable: true


SubmitFormField:

  type: object
  properties:
    value:
      oneOf:
        - { type: string }
        - { type: number }
        - { type: boolean }
        - { type: array, items: {} }
        - { $ref: "file-upload.yaml#/FileUploadParams", description: "Para FILE_FIELD" }
        - { type: array, items: { $ref: "file-upload.yaml#/FileUploadParams" }, description: "Para FILE_FIELD (múltiplos arquivos)" }
        - { type: object, additionalProperties: { type: boolean } }
    field_key:
      type: string

SubmitFormFieldFlat:
  type: object
  required: [section_id, field_key, value]
  properties:
    section_id: { type: integer }
    field_key: { type: string }
    value:
      nullable: true
      oneOf:
        - { type: string }
        - { type: number }
        - { type: boolean }
        - { type: array, items: {} }
        - { $ref: "file-upload.yaml#/FileUploadParams", description: "Para FILE_FIELD" }
        - { type: array, items: { $ref: "file-upload.yaml#/FileUploadParams" }, description: "Para FILE_FIELD (múltiplos arquivos)" }
        - { type: object, additionalProperties: { type: boolean } }

SubmitFormSection:
  type: object
  required: [section_id, fields]
  properties:
    section_id: { type: integer }
    fields:
      type: array
      items: { $ref: "#/SubmitFormField" }
