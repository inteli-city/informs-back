FileUploadParams:
  type: object
  properties:
    filename: { type: string }
    mimetype: { type: string }
  required: [filename, mimetype]
  description: Schema para upload de arquivo em qualquer requisição.


FileUpload:
  type: object
  properties:
    filename: { type: string, nullable: true }
    mimetype: { type: string }
    pre_signed_url: { type: string }
    file_path: { type: string }
    file_url: { type: string }
    section_id: { type: integer, nullable: true }
    field_key: { type: string, nullable: true }
    file_index: { type: integer, nullable: true }