Justification:
  type: object
  required: [options]
  properties:
    options:
      type: array
      items: { $ref: "#/JustificationOption" }
    selected:
      $ref: "#/JustificationSelected"
      nullable: true



JustificationOption:
  type: object
  properties:
    option: { type: string, description: "Texto da opção" }
    required_image: { type: boolean, default: false }
    required_text: { type: boolean, default: false }
  required: [option]



JustificationSelected:
  type: object
  properties:
    option: { type: string }
    text: { type: string, nullable: true }
    image_url: { type: string, nullable: true }




