Template:
  type: object
  required: [id, name, description, system, is_active, created_by, created_at, updated_at, sections]
  properties:
    id: { type: string, readOnly: true }
    name: { type: string }
    description: { type: string, nullable: true }
    system: { type: string }
    is_active: { type: boolean, default: true }
    created_by: { type: string }
    created_at: { type: integer, format: int64, readOnly: true, description: "Timestamp em ms" }
    updated_at: { type: integer, format: int64, readOnly: true, description: "Timestamp em ms" }
    sections:
      type: array
      items: { $ref: "form.yaml#/FormSection" }

TemplateSection:
  type: object
  required: [section_id, fields]
  properties:
    section_id: { type: number }
    fields:
      type: array
      items: { $ref: "field.yaml#/Field" }
