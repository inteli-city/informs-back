openapi: 3.0.0
info:
  title: Informs Contracts (Code-first)
  version: 1.0.0
paths:
  /forms:
    post:
      summary: Criação de novo formulário
      tags:
      - Forms
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFormResponseSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFormRequestSchema'
    get:
      summary: Listagem de formulários com filtros
      tags:
      - Forms
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllFormsResponseSchema'
  /forms/{formId}:
    get:
      summary: Consulta formulário por ID
      tags:
      - Forms
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFormResponseSchema'
  /forms/{formId}/start:
    post:
      summary: Inicia o preenchimento (Preenchedor)
      tags:
      - Forms
      responses:
        '204':
          description: Success
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartFormRequestSchema'
  /forms/{formId}/submit:
    post:
      summary: Submete o formulário preenchido
      tags:
      - Forms
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitFormResponseSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFormRequestSchema'
  /forms/{formId}/cancel:
    post:
      summary: Cancela o formulário
      tags:
      - Forms
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelFormResponseSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelFormRequestSchema'
  /templates:
    post:
      summary: Criação de novo template de formulário
      tags:
      - Templates
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTemplateResponseSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequestSchema'
    get:
      summary: Listagem de templates
      tags:
      - Templates
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllTemplatesResponseSchema'
  /templates/{template_id}:
    put:
      summary: Altera um template
      tags:
      - Templates
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTemplateResponseSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateRequestSchema'
    get:
      summary: Consulta template por ID
      tags:
      - Templates
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTemplateResponseSchema'
  /forms/sync-origin/callback:
    post:
      summary: Callback de falhas de sincronização de formulários
      tags:
      - Sync
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncCallbackResponseSchema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncCallbackRequestSchema'
components:
  schemas:
    CreateFormRequestSchema:
      properties:
        form_title:
          title: Form Title
          type: string
        user_id:
          title: User Id
          type: string
        system:
          title: System
          type: string
        city:
          title: City
          type: string
        street:
          title: Street
          type: string
        latitude:
          title: Latitude
          type: number
        longitude:
          title: Longitude
          type: number
        priority:
          maximum: 3
          minimum: 0
          title: Priority
          type: integer
        justifications:
          items:
            $ref: '#/components/schemas/JustificationOptionSchema'
          title: Justifications
          type: array
        sections:
          anyOf:
          - items:
              $ref: '#/components/schemas/FormSectionSchema'
            type: array
          - type: 'null'
          default: null
          title: Sections
        template:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Template
        observation:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Observation
        expiration_date:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Expiration Date
        information_fields:
          anyOf:
          - items:
              discriminator:
                mapping:
                  FILE_INFORMATION_FIELD: '#/components/schemas/FileInformationFieldInputSchema'
                  MAP_INFORMATION_FIELD: '#/components/schemas/MapInformationFieldInputSchema'
                  TEXT_INFORMATION_FIELD: '#/components/schemas/TextInformationFieldInputSchema'
                propertyName: information_field_type
