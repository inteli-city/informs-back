              - $ref: '#/components/schemas/FileInformationFieldInputSchema'
            type: array
          - type: 'null'
          default: null
          title: Information Fields
      required:
      - form_title
      - user_id
      - system
      - city
      - street
      - latitude
      - longitude
      - priority
      - justifications
      title: CreateFormRequestSchema
      type: object
    FileInformationFieldInputSchema:
      properties:
        information_field_type:
          const: FILE_INFORMATION_FIELD
          enum:
          - FILE_INFORMATION_FIELD
          title: Information Field Type
          type: string
        filename:
          title: Filename
          type: string
        mimetype:
